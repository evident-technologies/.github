name: Qualify Polyglot CI R1

on:
  pull_request:
    paths:
      - .github/workflows/polyglot-ci.yml
      - .github/workflows/polyglot-ci-qualification.yml
      - scripts/test-polyglot-ci.py
      - governance/engineering-profiles.json
  push:
    branches: [main]
    paths:
      - .github/workflows/polyglot-ci.yml
      - .github/workflows/polyglot-ci-qualification.yml
      - scripts/test-polyglot-ci.py
      - governance/engineering-profiles.json

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify workflow boundaries
        run: python3 scripts/test-polyglot-ci.py

