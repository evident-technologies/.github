name: Validate Runner Implementation

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/runner-fabric.json"
      - "governance/runner-admission.json"
      - "docs/RUNNER-FABRIC.md"
      - "scripts/validate-runner-fabric.py"
      - ".github/workflows/runner-contract.yml"
      - ".github/workflows/runner-implementation-validate.yml"
  push:
    branches: [main]
    paths:
      - "governance/runner-fabric.json"
      - "governance/runner-admission.json"
      - "scripts/validate-runner-fabric.py"
      - ".github/workflows/runner-contract.yml"
      - ".github/workflows/runner-implementation-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-implementation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 scripts/validate-runner-fabric.py
