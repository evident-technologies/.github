name: Reusable Ecosystem Contract Check

on:
  workflow_call:
    inputs:
      registry-root:
        description: Directory containing JSON contract registries
        required: false
        default: control-plane/registry
        type: string

permissions:
  contents: read

jobs:
  validate-contract-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate JSON contracts
        shell: bash
        env:
          REGISTRY_ROOT: ${{ inputs.registry-root }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["REGISTRY_ROOT"])

          if not root.is_dir():
              raise SystemExit(f"Registry directory is missing: {root}")

          files = sorted(root.rglob("*.json"))

          if not files:
              raise SystemExit(f"No JSON contracts found under: {root}")

          for path in files:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"validated={path}")
          PY
