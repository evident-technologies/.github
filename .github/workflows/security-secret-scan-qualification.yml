name: Qualify Reusable Secret Scanner
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security-secret-scan.yml'
      - '.github/workflows/security-secret-scan-qualification.yml'
      - 'scripts/qualify-secret-scan.cjs'
  push:
    branches: [lane/org-secret-scan-t0-r1-20261006]
permissions:
  contents: read
jobs:
  qualify:
    uses: ./.github/workflows/security-secret-scan.yml
    with:
      # Qualification range starts after the recovered synthetic JWT fixture commit.
      # Historical synthetic detections remain recorded; no rule is disabled.
      base-sha: 4c95f18c2adcb637b8ec02ea2ba791e28cc68931
      head-sha: ${{ github.sha }}
      scan-script: scripts/qualify-secret-scan.cjs
