#
# Reusable: security-secret-scan (top-level)
# Scans for leaked secrets, API keys, and credentials.
# Callers: evident-foundry, evident-desktop, satellites, platform, and any
#          future consumer repo.
# SHA-pinned actions per action-pins.json.

name: Security Secret Scan

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version (for custom scan scripts)"
        required: false
        default: "24"
        type: string
      scan-script:
        description: "Path to custom secret scan script (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Determine diff range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="$AFTER^..$AFTER"
            else
              RANGE="$BEFORE..$AFTER"
            fi
          fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Run secret scan
        env:
          SCAN_SCRIPT: ${{ inputs.scan-script }}
          DIFF_RANGE: ${{ steps.range.outputs.range }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { statSync } = require('node:fs');
          const range = process.env.DIFF_RANGE;
          const script = process.env.SCAN_SCRIPT;
          if (!range) throw new Error('Secret scan requires a Git diff range.');
          const git = (args) => {
            const result = spawnSync('git', args, {
              encoding: 'utf8', maxBuffer: 64 * 1024 * 1024,
            });
            if (result.error || result.status !== 0) {
              throw new Error('Secret scan could not read the requested Git range.');
            }
            return result.stdout;
          };
          // Trust only explicit commit ranges emitted by the range step.
          const match = /^([0-9a-f]{40}(?:\^)?)\.\.([0-9a-f]{40})$/.exec(range);
          if (!match) throw new Error('Secret scan requires an explicit commit range.');
          for (const revision of match.slice(1)) {
            git(['rev-parse', '--verify', `${revision}^{commit}`]);
          }
          // Validate Git readability before either detector branch can succeed.
          const files = git(['diff', '--no-ext-diff', '--no-textconv',
            '--diff-filter=ACM', '--name-only', '-z', range, '--'])
            .split('\0').filter(Boolean);
          if (script) {
            let isFile = false;
            try { isFile = statSync(script).isFile(); } catch {}
            if (!isFile) throw new Error('Configured secret scanner is unavailable.');
            const result = spawnSync(process.execPath, [script, '--diff-range', range], {
              stdio: 'inherit',
            });
            if (result.error || result.status !== 0) {
              throw new Error('Configured secret scanner failed.');
            }
          } else {
            const pattern = new RegExp("(AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24,}|sk_test_[0-9a-zA-Z]{24,}|-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----|ghp_[0-9a-zA-Z]{36}|gho_[0-9a-zA-Z]{36}|github_pat_[0-9a-zA-Z_]{82}|eyJ[A-Za-z0-9_-]*\\.eyJ[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]*|supabase_[A-Za-z0-9]{40,})", 'i');
            let findings = 0;
            for (const file of files) {
              const diff = git(['--literal-pathspecs', 'diff', '--no-ext-diff',
                '--no-textconv', '--unified=0', range, '--', file]);
              let inHunk = false;
              for (const line of diff.split('\n')) {
                if (line.startsWith('@@ ')) inHunk = true;
                else if (line.startsWith('diff --git ')) inHunk = false;
                if (inHunk && line.startsWith('+') &&
                    pattern.test(line.slice(1))) findings += 1;
              }
            }
            if (findings) {
              throw new Error(`Potential secrets detected in ${findings} added lines; values redacted.`);
            }
            console.log('Secret scan completed: no matching patterns in added lines.');
          }
          NODE
