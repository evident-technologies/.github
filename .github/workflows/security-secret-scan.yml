#
# Reusable: security-secret-scan (top-level)
# Scans for leaked secrets, API keys, and credentials.
# Callers require independently verified access, inputs and runner admission.
# Review actual action references and the pin manifest separately.

name: Security Secret Scan

on:
  workflow_call:
    inputs:
      base-sha:
        description: "Explicit base commit for manual qualification; ROOT scans all reachable commits"
        required: false
        default: ""
        type: string
      head-sha:
        description: "Explicit head commit; must be supplied with base-sha"
        required: false
        default: ""
        type: string
      node-version:
        description: "Node.js version (for custom scan scripts)"
        required: false
        default: "24"
        type: string
      scan-script:
        description: "Path to custom secret scan script (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Determine diff range
        id: range
        env:
          INPUT_BASE: ${{ inputs.base-sha }}
          INPUT_HEAD: ${{ inputs.head-sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_BASE" ] || [ -n "$INPUT_HEAD" ]; then
            BASE="$INPUT_BASE"
            HEAD="$INPUT_HEAD"
          elif [ "$EVENT_NAME" = pull_request ]; then
            BASE="$EVENT_BASE"
            HEAD="$EVENT_HEAD"
          elif [ "$EVENT_NAME" = push ] && [ -n "$EVENT_BEFORE" ]; then
            BASE="$EVENT_BEFORE"
            HEAD="$EVENT_HEAD"
            if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=ROOT; fi
          else
            echo 'SCAN_EXECUTION_FAILED: explicit base-sha and head-sha required.' >&2
            exit 1
          fi
          if ! [[ "$BASE" =~ ^(ROOT|[0-9a-f]{40})$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SCAN_EXECUTION_FAILED: invalid range inputs.' >&2
            exit 1
          fi
          echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"

      - name: Run secret scan
        env:
          SCAN_SCRIPT: ${{ inputs.scan-script }}
          DIFF_RANGE: ${{ steps.range.outputs.range }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { statSync } = require('node:fs');
          const range = process.env.DIFF_RANGE;
          const script = process.env.SCAN_SCRIPT;
          const fail = () => { throw new Error('SCAN_EXECUTION_FAILED'); };
          const git = (args) => {
            const result = spawnSync('git', args, {
              encoding: 'utf8', maxBuffer: 64 * 1024 * 1024, timeout: 30000,
              env: { ...process.env, GIT_NO_REPLACE_OBJECTS: '1' },
            });
            if (result.error || result.status !== 0 || result.stderr) fail();
            return result.stdout;
          };
          try {
            const match = /^(ROOT|[0-9a-f]{40}(?:\^)?)\.\.([0-9a-f]{40})$/.exec(range || '');
            if (!match) fail();
            const [, base, head] = match;
            git(['rev-parse', '--verify', head + '^{commit}']);
            if (base !== 'ROOT') {
              git(['rev-parse', '--verify', base + '^{commit}']);
              git(['merge-base', '--is-ancestor', base, head]);
            }
            const commits = git(['rev-list', '--reverse', '--topo-order',
              ...(base === 'ROOT' ? [head] : [range]), '--']).trim().split('\n').filter(Boolean);
            if (commits.length > 10000) fail();
            const pattern = new RegExp("(AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24,}|sk_test_[0-9a-zA-Z]{24,}|-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----|ghp_[0-9a-zA-Z]{36}|gho_[0-9a-zA-Z]{36}|github_pat_[0-9a-zA-Z_]{82}|eyJ[A-Za-z0-9_-]*\\.eyJ[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]*|supabase_[A-Za-z0-9]{40,})", 'i');
            let findings = 0;
            for (const commit of commits) {
              // -m compares merges with every parent. --no-renames represents renames
              // as deletion + addition. Read committed blobs, never working-tree substitutes.
              const args = ['diff-tree', '-m', '-r', '--root', '--no-commit-id',
                '--no-ext-diff', '--no-textconv', '--no-renames', '--diff-filter=ACMT'];
              const files = git([...args, '--name-only', '-z', commit, '--']).split('\0').filter(Boolean);
              for (const file of new Set(files)) {
                const content = git(['cat-file', 'blob', commit + ':' + file]);
                let lineNumber = 0;
                for (const line of content.split('\n')) {
                  lineNumber += 1;
                  if (pattern.test(line)) {
                    findings += 1;
                    console.log(JSON.stringify({ rule_id: 'CREDENTIAL_PATTERN',
                      commit, path_uri: encodeURIComponent(file), line: lineNumber,
                      remediation: 'Remove disclosure; privately assess exposure and rotation.' }));
                  }
                }
              }
            }
            // Built-in detection always runs. A caller-selected script cannot replace it.
            if (findings) {
              console.error('SCAN_FINDINGS: matching changed blobs; values redacted.');
              process.exitCode = 1;
            } else if (script) {
              let isFile = false;
              try { isFile = statSync(script).isFile(); } catch {}
              if (!isFile) fail();
              const result = spawnSync(process.execPath, [script, '--diff-range', range], {
                stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 8 * 1024 * 1024, timeout: 30000,
              });
              // Never forward scanner-controlled stdout/stderr or exception values.
              if (result.error || result.status !== 0) fail();
              console.log('Secret scan completed; custom diagnostics withheld.');
            } else {
              console.log('Secret scan completed: no matching patterns in changed blobs.');
            }
          } catch {
            console.error('SCAN_EXECUTION_FAILED: review the private scanner/range configuration.');
            process.exitCode = 1;
          }

          NODE
