name: Evident Polyglot CI R1

on:
  workflow_call:
    inputs:
      platform:
        description: "Fixed portable runner class: linux, windows, or macos."
        type: string
        default: linux
      node-version:
        description: Exact stable Node.js version, or empty when not required.
        type: string
        default: ''
      npm-version:
        description: Exact npm version; requires node-version. Empty preserves supplied npm.
        type: string
        default: ''
      python-version:
        description: Exact CPython version, or empty when not required.
        type: string
        default: ''
      dotnet-version:
        description: Exact .NET SDK version, or empty when not required.
        type: string
        default: ''
      go-version:
        description: Exact Go version, or empty when not required.
        type: string
        default: ''
      rust-toolchain:
        description: Exact stable Rust toolchain; uses the runner's existing rustup.
        type: string
        default: ''
      working-directory:
        description: Existing relative product directory inside the checked-out repository.
        type: string
        default: .
      install-command:
        description: Reviewed product-owned locked installation command; empty skips installation.
        type: string
        default: ''
      verify-command:
        description: Reviewed product-owned verification command; must write bounded receipts.
        type: string
        required: true
      artifact-path:
        description: Explicit repository-relative output directory below artifacts/ or reports/.
        type: string
        default: artifacts/ci
      artifact-name:
        description: Unique caller job label for reports; platform and run attempt are appended.
        type: string
        default: verification

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ inputs.platform }}
    # Inputs never select an arbitrary runner group or self-hosted label.
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2025' || inputs.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact event source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Validate bounded inputs
        id: inputs
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_NODE: ${{ inputs.node-version }}
          INPUT_NPM: ${{ inputs.npm-version }}
          INPUT_PYTHON: ${{ inputs.python-version }}
          INPUT_DOTNET: ${{ inputs.dotnet-version }}
          INPUT_GO: ${{ inputs.go-version }}
          INPUT_RUST: ${{ inputs.rust-toolchain }}
          INPUT_WORKDIR: ${{ inputs.working-directory }}
          INPUT_ARTIFACT: ${{ inputs.artifact-path }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          INPUT_VERIFY: ${{ inputs.verify-command }}
        run: |
          set -euo pipefail
          case "$INPUT_PLATFORM" in linux|windows|macos) ;; *) echo 'Invalid platform' >&2; exit 2;; esac
          for key in INPUT_NODE INPUT_NPM INPUT_PYTHON INPUT_DOTNET INPUT_GO INPUT_RUST; do
            value="${!key}"
            if [[ -n "$value" && ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Exact stable version required for $key" >&2; exit 2
            fi
          done
          if [[ -n "$INPUT_NPM" && -z "$INPUT_NODE" ]]; then
            echo 'npm requires an explicit Node.js version' >&2; exit 2
          fi
          if [[ ! "$INPUT_WORKDIR" =~ ^[A-Za-z0-9._/-]+$ || "$INPUT_WORKDIR" == /* ]]; then
            echo 'Invalid relative working directory' >&2; exit 2
          fi
          case "/$INPUT_WORKDIR/" in */../*|*//* ) echo 'Invalid working directory traversal' >&2; exit 2;; esac
          if [[ ! "$INPUT_ARTIFACT" =~ ^(artifacts|reports)/[A-Za-z0-9._/-]+$ ]]; then
            echo 'An explicit bounded artifact directory is required' >&2; exit 2
          fi
          case "/$INPUT_ARTIFACT/" in */../*|*/./*|*//* ) echo 'Invalid artifact traversal' >&2; exit 2;; esac
          if [[ ! "$INPUT_ARTIFACT_NAME" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo 'Invalid artifact name' >&2; exit 2
          fi
          if [[ ! "$INPUT_VERIFY" =~ [^[:space:]] ]]; then echo 'Verification command required' >&2; exit 2; fi
          root="$(pwd -P)"
          target="$(cd -- "$INPUT_WORKDIR" && pwd -P)"
          case "$target" in "$root"|"$root"/*) ;; *) echo 'Working directory escapes checkout' >&2; exit 2;; esac

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: false
          package-manager-cache: false

      - name: Select exact npm
        if: inputs.npm-version != ''
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
        run: |
          set -euo pipefail
          if [[ "$(npm --version)" != "$NPM_VERSION" ]]; then
            npm install --global --ignore-scripts --no-audit --no-fund "npm@$NPM_VERSION"
          fi
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Setup Python
        if: inputs.python-version != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          check-latest: false
          allow-prereleases: false

      - name: Setup .NET SDK
        if: inputs.dotnet-version != ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          check-latest: false
          skip-lts-prepass: true
          cache: false

      - name: Setup Go
        if: inputs.go-version != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: false
          cache: false

      - name: Setup Rust components
        if: inputs.rust-toolchain != ''
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { echo 'BLOCKED: existing rustup unavailable' >&2; exit 2; }
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup run "$RUST_TOOLCHAIN" rustc --version
          rustup run "$RUST_TOOLCHAIN" cargo --version

      - name: Verify selected SDK and runtime versions
        working-directory: ${{ inputs.working-directory }}
        env:
          EXPECTED_NODE: ${{ inputs.node-version }}
          EXPECTED_NPM: ${{ inputs.npm-version }}
          EXPECTED_PYTHON: ${{ inputs.python-version }}
          EXPECTED_DOTNET: ${{ inputs.dotnet-version }}
          EXPECTED_GO: ${{ inputs.go-version }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_NODE" ]]; then test "$(node --version)" = "v$EXPECTED_NODE"; fi
          if [[ -n "$EXPECTED_NPM" ]]; then test "$(npm --version)" = "$EXPECTED_NPM"; fi
          if [[ -n "$EXPECTED_PYTHON" ]]; then
            test "$(python -c 'import platform; print(platform.python_version())')" = "$EXPECTED_PYTHON"
          fi
          if [[ -n "$EXPECTED_DOTNET" ]]; then test "$(dotnet --version)" = "$EXPECTED_DOTNET"; fi
          if [[ -n "$EXPECTED_GO" ]]; then test "$(go env GOVERSION)" = "go$EXPECTED_GO"; fi

      - name: Locked product installation
        if: inputs.install-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          EVIDENT_INSTALL_COMMAND: ${{ inputs.install-command }}
          EVIDENT_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          if [[ -n "$EVIDENT_RUST_TOOLCHAIN" ]]; then export RUSTUP_TOOLCHAIN="$EVIDENT_RUST_TOOLCHAIN"; fi
          bash --noprofile --norc -e -o pipefail -c "$EVIDENT_INSTALL_COMMAND"

      - name: Product verification
        working-directory: ${{ inputs.working-directory }}
        env:
          EVIDENT_VERIFY_COMMAND: ${{ inputs.verify-command }}
          EVIDENT_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          EVIDENT_CI_PLATFORM: ${{ inputs.platform }}
          EVIDENT_SOURCE_EVENT_SHA: ${{ github.sha }}
          EVIDENT_SOURCE_CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
          EVIDENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          if [[ -n "$EVIDENT_RUST_TOOLCHAIN" ]]; then export RUSTUP_TOOLCHAIN="$EVIDENT_RUST_TOOLCHAIN"; fi
          bash --noprofile --norc -e -o pipefail -c "$EVIDENT_VERIFY_COMMAND"

      - name: Validate explicit report directory
        # Product-created failure reports are retained. Setup/install failures
        # may have only Actions job/step logs and must never be called a PASS.
        id: reports
        if: always() && steps.inputs.outcome == 'success'
        env:
          REPORT_DIRECTORY: ${{ inputs.artifact-path }}
        run: |
          set -euo pipefail
          root="$(pwd -P)"
          target="$(cd -- "$REPORT_DIRECTORY" && pwd -P)"
          case "$target" in "$root"/artifacts/*|"$root"/reports/*) ;; *) echo 'Report directory escapes its boundary' >&2; exit 2;; esac
          if [[ -n "$(find "$REPORT_DIRECTORY" -type l -print -quit)" ]]; then
            echo 'Report symlinks are not accepted' >&2; exit 2
          fi
          test -n "$(find "$REPORT_DIRECTORY" -type f -print -quit)"

      - name: Preserve product verification reports
        if: always() && steps.reports.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyglot-${{ inputs.artifact-name }}-${{ inputs.platform }}-${{ github.run_attempt }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7

