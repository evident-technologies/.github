name: Public defect report
description: Report a non-sensitive defect in public source or documentation.
title: "[defect] "
body:
  - type: markdown
    attributes:
      value: |
        This is a public form. Use synthetic examples only. Do not include credentials,
        personal data, case records, customer files, private infrastructure, or vulnerability details.
        Report security concerns under [SECURITY.md](https://github.com/evident-technologies/.github/blob/main/SECURITY.md).
        Review is discretionary. A report does not authorize code contributions or system testing.
  - type: input
    id: revision
    attributes:
      label: Affected repository and revision
      description: Public URL, full commit SHA or release, and affected file or feature.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and environment
      description: Numbered steps, relevant OS or browser versions, and synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed results
      description: Separate documented expectations from observations. State uncertainties and impact.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public reporting boundaries
      options:
        - label: This report contains no sensitive information or security vulnerability details.
          required: true
