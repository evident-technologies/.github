name: Capability proposal
description: Describe a bounded, non-sensitive improvement for consideration.
title: "[proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Share a public problem statement, not confidential plans or unsolicited implementation.
        External code contributions remain closed. A proposal is not an engagement, IP assignment,
        promise of compensation, roadmap commitment, or permission to test systems.
        See [CONTRIBUTING.md](https://github.com/evident-technologies/.github/blob/main/CONTRIBUTING.md).
  - type: input
    id: project
    attributes:
      label: Affected project or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
      description: Explain the practical need without personal or customer information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome, scope, and alternatives
      description: Include dependencies, privacy, safety, accessibility, and known limitations where relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public reporting boundaries
      options:
        - label: This proposal contains no confidential, personal, security-sensitive, or unauthorized material.
          required: true
